<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup page</title>
      <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .signup-form {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .signup-form h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .signup-form input[type="text"],
    .signup-form input[type="email"],
    .signup-form input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .signup-form button {
      width: 100%;
      padding: 10px;
      background: #28a745;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .signup-form button:hover {
      background: #218838;
    }
  </style
</head>
<body>
 <form class="signup-form" action="https://docs.google.com/forms/d/e/1FAIpQLSdE9eskFR7uFtAoaqnTU0a3-2B-Bu3ccOA7eYN5ZeJLx435vg/viewform?usp=header" method="post" target="_self">
    <h2>Signup</h2>

    <input type="text" name="entry.1234567890" placeholder="Full Name" required>
    <input type="email" name="entry.2345678901" placeholder="Email Address" required>
    <input type="password" name="entry.3456789012" placeholder="Password" required>

    <button type="submit">Sign Up</button>
  </form>
    
</body>
</html>
